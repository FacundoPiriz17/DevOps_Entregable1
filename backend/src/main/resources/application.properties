spring.application.name=devops_backend

spring.datasource.url=jdbc:postgresql://localhost:5432/devops_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
jwt.expiration-minutes=120

admin.bootstrap.email=${ADMIN_EMAIL:admin@devops.local}
admin.bootstrap.password=${ADMIN_PASSWORD:ChangeMe123!}
admin.bootstrap.country=${ADMIN_COUNTRY:Uruguay}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
