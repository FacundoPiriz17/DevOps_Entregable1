apiVersion: playhub/v1.0
kind: Deployment
metadata:
  name: playhub-frontend
  labels:
    app: playhub-frontend

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: playhub-frontend

  template:
    metadata:
      labels:
        app: playhub-frontend

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: playhub-frontend:v1.0
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 5745

          env:
            - name: PORT
              value: "5745"

            - name: HOSTNAME
              value: "0.0.0.0"

          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL